<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA PINHEIRO | CAMPANHAS DE FRETE</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-body: #0a0a0c; --card-bg: #1c1c1e; --pinheiro-blue: #4f46e5; --text-main: #ffffff; --text-dim: #a1a1aa; --border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 30px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; }
        .title-group h1 { font-size: 26px; font-weight: 800; text-transform: uppercase; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card-kpi { background: var(--card-bg); padding: 25px; border-radius: 24px; border: 1px solid var(--border); border-bottom: 4px solid var(--pinheiro-blue); }
        .kpi-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-weight: 700; }
        .kpi-value { font-size: 24px; font-weight: 800; margin-top: 8px; display: block; }
        .campaign-card { background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid var(--border); display: grid; grid-template-columns: 2fr repeat(5, 1fr); gap: 15px; align-items: center; margin-bottom: 12px; transition: 0.3s; }
        .campaign-card:hover { border-color: var(--pinheiro-blue); transform: scale(1.01); }
        .camp-name { font-weight: 800; font-size: 14px; }
        .metric-small { font-size: 13px; font-weight: 700; text-align: right; }
        .metric-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; text-align: right; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-group">
                <h1>Performance de Frete</h1>
                <div style="display:flex; gap:10px; margin-top:15px">
                    <select id="mesSelect" onchange="render()" style="background:#000; color:white; padding:8px 15px; border-radius:20px; border:1px solid var(--border)"></select>
                </div>
            </div>
            <img src="https://raw.githubusercontent.com/CamilaDS13/imagens/Principal/logobranca.png" style="height: 35px;">
        </header>

        <div class="metrics-grid">
            <div class="card-kpi"><span class="kpi-label">Investimento Total</span><span id="gInv" class="kpi-value">R$ 0,00</span></div>
            <div class="card-kpi"><span class="kpi-label">Pedidos Total</span><span id="gPed" class="kpi-value">0</span></div>
            <div class="card-kpi"><span class="kpi-label">Valor Compras</span><span id="gComp" class="kpi-value">R$ 0,00</span></div>
            <div class="card-kpi"><span class="kpi-label">Investimento %</span><span id="gPerc" class="kpi-value">0,00%</span></div>
        </div>

        <div id="camp-container"></div>
    </div>

    <script>
        const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRzUAT9CqT94eaRqGdvA2UKthhdW8jje2eYLIyy7beRQIT43vbk63fK4Mc1FWWxj6NDGgv3rB-dprBe/pub?output=csv";
        let dataStore = {};

        async function init() {
            const resp = await fetch(URL + "&t=" + new Date().getTime());
            const text = await resp.text();
            const rows = text.split('\n').map(l => l.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim()));
            
            rows.slice(1).forEach(r => {
                const mes = r[0].toUpperCase() + " / 2026";
                if(!dataStore[mes]) dataStore[mes] = [];
                dataStore[mes].push({ name:r[1], p:parseInt(r[2])||0, i:parseFloat(r[3])||0, pc:parseFloat(r[4])||0, c:parseFloat(r[5])||0 });
            });

            const sel = document.getElementById('mesSelect');
            sel.innerHTML = '<option value="consolidado">CONSOLIDADO ANUAL</option>';
            Object.keys(dataStore).forEach(m => sel.innerHTML += `<option value="${m}">${m}</option>`);
            sel.value = Object.keys(dataStore).pop();
            render();
        }

        function render() {
            const m = document.getElementById('mesSelect').value;
            let list = m === 'consolidado' ? Object.values(dataStore).flat() : dataStore[m];
            
            let res = {};
            list.forEach(c => {
                if(!res[c.name]) res[c.name] = { ...c };
                else { res[c.name].p += c.p; res[c.name].i += c.i; res[c.name].pc += c.pc; res[c.name].c += c.c; }
            });

            let final = Object.values(res);
            let tI = final.reduce((a,b)=>a+b.i,0); let tP = final.reduce((a,b)=>a+b.p,0); let tC = final.reduce((a,b)=>a+b.c,0);
            
            document.getElementById('gInv').innerText = tI.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
            document.getElementById('gPed').innerText = tP.toLocaleString('pt-BR');
            document.getElementById('gComp').innerText = tC.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
            document.getElementById('gPerc').innerText = ((tI/tC)*100 || 0).toFixed(2) + "%";

            document.getElementById('camp-container').innerHTML = final.map(c => `
                <div class="campaign-card">
                    <div class="camp-name">${c.name}</div>
                    <div><div class="metric-label">Pedidos</div><div class="metric-small">${c.p}</div></div>
                    <div><div class="metric-label">Investimento</div><div class="metric-small">R$ ${c.i.toLocaleString('pt-BR')}</div></div>
                    <div><div class="metric-label">Pago Cliente</div><div class="metric-small">R$ ${c.pc.toLocaleString('pt-BR')}</div></div>
                    <div><div class="metric-label">Venda</div><div class="metric-small">R$ ${c.c.toLocaleString('pt-BR')}</div></div>
                    <div><div class="metric-label">% Inv.</div><div class="metric-small" style="color:var(--pinheiro-blue)">${((c.i/c.c)*100||0).toFixed(2)}%</div></div>
                </div>
            `).join('');
        }
        window.onload = init;
    </script>
</body>
</html>
